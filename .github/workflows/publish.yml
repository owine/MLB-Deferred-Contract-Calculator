name: Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Vulnerability gate. Kept as its own job so a finding blocks every arch
  # before any build starts, rather than racing two matrix legs.
  scan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          # trivy-action v0.36.0 defaults to Trivy v0.70.0, which parses only
          # the FIRST document of pnpm v12's multi-document pnpm-lock.yaml.
          # Document 1 holds packageManagerDependencies (pnpm's own binaries);
          # the real dependency tree lives in document 2. The result was a
          # silent 0-package scan -- green because nothing was inspected, not
          # because nothing was vulnerable. v0.74.0 reads both documents
          # (verified: 123 packages extracted). Remove this pin once a
          # trivy-action release ships v0.74.0+ as its default.
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0

  # Native per-arch builds. Previously a single job built
  # linux/amd64,linux/arm64 on one x64 runner; with no setup-qemu-action step
  # buildx silently used the runner image's registered binfmt handlers, so the
  # arm64 half ran fully emulated (181-238s total) with nothing in the file to
  # show it. Each arch now builds on its own native runner.
  #
  # Each leg pushes by digest only -- no tags. The release tags are applied
  # once, to the manifest, by publish-manifest below. Tagging here would
  # publish single-arch images under the release tags, and whichever leg
  # finished last would win.
  build:
    needs: scan
    strategy:
      fail-fast: false
      matrix:
        # Renovate's built-in github-actions manager CANNOT see these labels:
        # it reads `runs-on:` off parsed YAML, where this job's value is the
        # literal string `${{ matrix.runner }}` with no version in it. Left
        # untracked that fails GREEN -- the two arches drift onto different
        # Ubuntu releases, both runner images work, and nothing flags the
        # mismatch (doc-scanner#209).
        # They ARE tracked now, by a second `github-runners` customManager in
        # the shared preset (owine/renovate-config#103), which keys on the
        # `runner:` key and captures with the same shape as the built-in
        # manager, so these land in the SAME PR as the literal `runs-on:`
        # values across this file, ci.yml and release-please.yml. So do not
        # bump by hand -- but keep the shape: one line per label,
        # `runner: <os>-<version>`, version's first character a digit, suffix
        # kept attached (`26.04-arm` is its own datasource version, not
        # `26.04` decorated). Renaming the key, moving a label behind an env
        # var, or splitting it across lines un-tracks it again, silently and
        # with no error anywhere.
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This repository's name contains capitals, but GHCR only accepts
      # lowercase paths. metadata-action lowercases `images:` for us, which is
      # why the old single-job build never needed this -- but push-by-digest's
      # `name=` and `imagetools create` take the string verbatim. Without this
      # step both would be handed owine/MLB-Deferred-Contract-Calculator and
      # rejected.
      - name: Compute image name (lowercase)
        id: image
        env:
          REPO: ${{ env.IMAGE_NAME }}
        run: |
          echo "name=${REGISTRY}/${REPO,,}" >> "$GITHUB_OUTPUT"

      # Labels only. `tags:` is deliberately not consumed by the build below --
      # see the job comment. metadata-action still computes its default tags
      # here; nothing reads them.
      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Unconditional push: this workflow only runs on `v*` tags and manual
          # dispatch. The fleet references gate this on
          # `github.ref == 'refs/heads/main'` because they build on every main
          # push; that condition would be false for every tag run here and
          # would never push anything.
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scopes. A shared `type=gha` scope would have both
          # legs writing the same cache manifest concurrently and clobbering
          # each other's entries.
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch manifest and apply the
  # release tags. These are the tag rules the old single-job build used,
  # unchanged -- including `latest`, whose {{is_default_branch}} does evaluate
  # true on a tag push (the v0.4.0 run tagged latest).
  publish-manifest:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: image
        env:
          REPO: ${{ env.IMAGE_NAME }}
        run: |
          echo "name=${REGISTRY}/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          # Arrays rather than unquoted command substitution so word splitting
          # isn't load-bearing (SC2046).
          tags=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            tags+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA")
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::metadata-action produced no tags; refusing to push an untagged manifest."
            exit 1
          fi
          images=()
          for digest in *; do
            images+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Inspect manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
