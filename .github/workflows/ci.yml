name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm/setup MUST run before setup-node so that setup-node's
      # `cache: pnpm` can find the pnpm binary. The version comes from the
      # `packageManager` field in package.json. `install: false` is required —
      # it defaults to true, which would duplicate the explicit install below.
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for known vulnerabilities
        run: pnpm audit --prod --audit-level=moderate
